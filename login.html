<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login — Study Document Submissions</title>
  <style>
    :root{--bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--brand:#2563eb;--brand2:#1d4ed8;--shadow:0 1px 2px rgba(16,24,40,.06),0 18px 40px -18px rgba(16,24,40,.35);}
    *{box-sizing:border-box;} body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 85% -10%,rgba(37,99,235,.08),transparent 60%),var(--bg);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;color:var(--text);border-top:4px solid var(--brand);}
    .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:30px;}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
    .brand .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(180deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;}
    h1{font-size:1.2rem;margin:0;letter-spacing:-.2px;}
    p.sub{color:var(--muted);font-size:.85rem;margin:4px 0 22px;}
    label{display:block;font-size:.78rem;font-weight:700;color:#334155;margin:14px 0 6px;}
    input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;font:inherit;font-size:.95rem;background:#fff;color:var(--text);}
    input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
    button{width:100%;margin-top:20px;padding:12px;border:none;border-radius:9px;background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;font-weight:700;font-size:.98rem;cursor:pointer;}
    button:hover{filter:brightness(1.06);} button:disabled{opacity:.6;cursor:default;}
    .err{color:#dc2626;font-size:.85rem;margin-top:14px;min-height:1em;}
    .hint{margin-top:18px;font-size:.76rem;color:var(--muted);border-top:1px solid var(--border);padding-top:14px;line-height:1.6;}
    .hint code{background:#f1f5f9;border:1px solid var(--border);border-radius:5px;padding:1px 6px;}
    .back{display:block;text-align:center;margin-top:16px;font-size:.82rem;color:var(--brand);text-decoration:none;}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot">S</span><h1>Staff Login</h1></div>
    <p class="sub">Study Document Submissions — Review access</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" autofocus />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button type="submit" id="btn">Sign in</button>
      <div class="err" id="err"></div>
    </form>
    <div class="hint">
      Roles: <code>admin</code> (full), <code>legal</code> (Legal track), <code>bd</code> (Business Development track).
    </div>
    <a class="back" id="pub" href="/app/">← Public submission form</a>
  </div>
  <script>
    const BASE=(function(){const p=location.pathname;const r=['/login','/login.html'];for(const x of r){if(p===x||p.endsWith(x))return p.slice(0,p.length-x.length);}return p.endsWith('/')?p.slice(0,-1):p;})();
    const u=p=>BASE+p;
    document.getElementById('pub').href=u('/');
    const params=new URLSearchParams(location.search);
    const next=params.get('next')||'/review';
    const form=document.getElementById('loginForm'), err=document.getElementById('err'), btn=document.getElementById('btn');
    form.addEventListener('submit',async e=>{
      e.preventDefault(); err.textContent='';
      const username=document.getElementById('username').value.trim();
      const password=document.getElementById('password').value;
      if(!username||!password){err.textContent='Please enter username and password.';return;}
      btn.disabled=true; btn.textContent='Signing in...';
      try{
        const res=await fetch(u('/api/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
        const data=await res.json().catch(()=>({}));
        if(res.ok&&data.token){
          sessionStorage.setItem('staff_token',data.token);
          sessionStorage.setItem('staff_role',data.role);
          sessionStorage.setItem('staff_name',data.name);
          location.href=u(next.startsWith('/')?next:'/'+next);
        }else{
          err.textContent=data.error||('Login failed (HTTP '+res.status+')');
          btn.disabled=false; btn.textContent='Sign in';
        }
      }catch(ex){ err.textContent='Network error: '+ex.message; btn.disabled=false; btn.textContent='Sign in'; }
    });
  </script>
</body>
</html>
